backend:
  name: github
  repo: heysheevcharan/nikkitizon-site
  branch: main
  base_url: https://decap-proxy.sheevstartup.workers.dev

media_folder: public/images
public_folder: /images

# Photos and videos can also be uploaded to Cloudinary (sign in with the Cloudinary account).
# Never put the Cloudinary API secret here; only the cloud name and the API key.
media_libraries:
  cloudinary:
    config:
      cloud_name: jk5c7qj3
      api_key: "612159581429127"
    output_filename_only: false

collections:
  # ── Tags ─────────────────────────────────────────────────────────────────────
  - name: tags
    label: "Tags"
    label_singular: Tag
    folder: src/content/tags
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Tag name exactly as it appears on posts (e.g. AI, b2b, self-discovery)"

