  # ── Portfolio page (/portfolio) ─────────────────────────────────────────────
  - name: portfolio
    label: "Portfolio"
    files:
      - name: portfolio
        label: Portfolio page
        file: src/data/portfolio.json
        format: json
        description: "Sections of /portfolio. Each section has groups (e.g. 'Hotel room vibes'); each group has photos/videos uploaded to Cloudinary."
        fields:
          - label: Sections
            name: sections
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Anchor id, name: id, widget: string, hint: "Short id used in links, e.g. stays or food" }
              - { label: Small label, name: kicker, widget: string, required: false }
              - label: Groups
                name: groups
                widget: list
                collapsed: true
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Label, name: label, widget: string, required: false, hint: "Optional, e.g. 'Client · full social media management'" }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: Chips, name: chips, widget: list, required: false }
                  - label: Layout
                    name: layout
                    widget: select
                    default: collage
                    options:
                      - { label: "Scrapbook collage (tilted polaroids)", value: collage }
                      - { label: "Photo wall (grid of taped prints)", value: wall }
                      - { label: "Reels row (scrolls sideways)", value: reels }
                      - { label: "Cards (one video per card, caption = name)", value: cards }
                      - { label: "Feature card (text left, collage right)", value: feature }
                  - label: Photos & videos
                    name: items
                    widget: list
                    summary: "{{fields.caption}} {{fields.alt}}"
                    fields:
                      - { label: Photo or video, name: src, widget: file }
                      - { label: "Cover image (videos, optional)", name: poster, widget: image, required: false }
                      - { label: Description, name: alt, widget: string, required: false }
                      - { label: Caption, name: caption, widget: string, required: false, hint: "Handwritten label under a polaroid" }

  # ── Home page — personal details + bio ──────────────────────────────────────
  - name: home
    label: "Home (/)"
    files:
      - name: home
        label: Home Page
        file: src/content/home/home.mdx
        fields:
          - label: Your Name
            name: name
            widget: string
          - label: Tagline
            name: tagline
            widget: string
            hint: "Short bio shown at the bottom of the sidebar"
          - label: Email
            name: email
            widget: string
            required: false
          - label: Instagram URL
            name: instagram
            widget: string
            required: false
          - label: Second Instagram URL
            name: instagram2
            widget: string
            required: false
          - label: Headline words
            name: roles
            widget: list
            required: false
            hint: "The homepage types these out one after another after \"I'm Nikki, a\" (e.g. ugc_creator,)"
          - label: Headline second line
            name: heroLine
            widget: string
            required: false
          - label: Bio
            name: body
            widget: markdown
            hint: "Shown in the About section of the homepage — supports markdown"

  # ── Pages — about, now, projects, anything else ─────────────────────────────
  - name: pages
    label: "Pages (about, now, etc.)"
    folder: src/content/site-pages
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Shown in the nav and as the page heading (e.g. 'about', 'now')"
      - label: URL Slug
        name: slug
        widget: string
        hint: "URL path — must start with / (e.g. /about, /now, /projects)"
      - label: Content
        name: body
        widget: markdown
      - label: Meta Description
        name: description
        widget: string
        required: false
        hint: "Controls the text snippet shown under your page title in Google search results, and the preview text when shared on Twitter/X, LinkedIn, WhatsApp or iMessage. Keep it under 155 characters. Leave blank to auto-generate from page content."
      - label: Show in Nav
        name: showInNav
        widget: boolean
        default: true
      - label: Nav Order
        name: navOrder
        widget: number
        default: 99
        hint: "Lower = earlier in nav. home=1, blog=2, about=3"
      - label: Canva Embed
        name: canvaEmbed
        widget: string
        required: false
        hint: "Optional. In Canva: Share → More → Embed, then paste the embed link or the whole embed code here to show a Canva design on this page."

  # ── Blog posts ───────────────────────────────────────────────────────────────
  - name: blog
    label: "Blog Posts (/blog)"
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    sortable_fields:
      - pubDate
      - title
    default_sort_field: pubDate
    default_sort_direction: descending
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        hint: "Shown under the post title in Google search results, on the blog list page, and when the post is shared on social media. Write 1-2 clean sentences, no markdown, under 155 characters."
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
      - label: Tags
        name: tags
        widget: relation
        collection: tags
        search_fields: [title]
        display_fields: [title]
        value_field: title
        required: false
        multiple: true
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: "Toggle off to publish"
      - label: Cover Image
        name: image
        widget: image
        required: false
        hint: "Used for social sharing preview (OG image)"
      - label: Body
        name: body
        widget: markdown
