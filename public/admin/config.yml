  # ── Portfolio page (/portfolio): same slides and layout as the Canva site ──────
  - name: portfolio
    label: "Portfolio"
    files:
      - name: portfolio
        label: Portfolio page
        file: src/data/portfolio.json
        format: json
        description: "The 20 slides of /portfolio, laid out like the Canva site. Swap a photo/video or edit text here; positions are percentages of the slide (x/y from the top-left, w/h = size) and usually don't need changing."
        fields:
          - label: Slides
            name: slides
            widget: list
            collapsed: true
            summary: "{{fields.id}}"
            fields:
              - { label: Section, name: id, widget: string, hint: "stays, food, offer… (used for the jump links)" }
              - label: Items
                name: items
                widget: list
                collapsed: true
                summary: "{{fields.type}} {{fields.text}}"
                fields:
                  - { label: Type, name: type, widget: select, options: [image, video, text, pin, phone] }
                  - { label: "Photo or video", name: src, widget: file, required: false }
                  - { label: Description, name: alt, widget: string, required: false }
                  - { label: Text, name: text, widget: text, required: false }
                  - { label: "Text style", name: role, widget: select, required: false, options: [display, heading, kicker, label, body] }
                  - { label: "Text size (% of slide width)", name: size, widget: number, value_type: float, required: false }
                  - { label: "Line height", name: lh, widget: number, value_type: float, required: false }
                  - { label: Alignment, name: align, widget: select, required: false, options: [left, center, right] }
                  - { label: Italic, name: italic, widget: boolean, required: false }
                  - { label: "Caption of item #", name: captionFor, widget: number, required: false, hint: "Set on a label that sits under a photo/video (0-based item number)" }
                  - { label: "Cut-out image", name: cutout, widget: boolean, required: false }
                  - label: Position
                    name: box
                    widget: object
                    collapsed: true
                    fields:
                      - { label: x, name: x, widget: number, value_type: float }
                      - { label: y, name: y, widget: number, value_type: float }
                      - { label: w, name: w, widget: number, value_type: float }
                      - { label: h, name: h, widget: number, value_type: float }
                  - label: "Crop (inside the frame)"
                    name: crop
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: x, name: x, widget: number, value_type: float }
                      - { label: y, name: y, widget: number, value_type: float }
                      - { label: w, name: w, widget: number, value_type: float }
                      - { label: h, name: h, widget: number, value_type: float }

  # ── Home page — personal details + bio ──────────────────────────────────────
  - name: home
    label: "Home (/)"
    files:
      - name: home
        label: Home Page
        file: src/content/home/home.mdx
        fields:
          - label: Your Name
            name: name
            widget: string
          - label: Tagline
            name: tagline
            widget: string
            hint: "Short bio shown at the bottom of the sidebar"
          - label: Email
            name: email
            widget: string
            required: false
          - label: Instagram URL
            name: instagram
            widget: string
            required: false
          - label: Second Instagram URL
            name: instagram2
            widget: string
            required: false
          - label: Headline words
            name: roles
            widget: list
            required: false
            hint: "The homepage types these out one after another after \"I'm Nikki, a\" (e.g. ugc_creator,)"
          - label: Headline second line
            name: heroLine
            widget: string
            required: false
          - label: Bio
            name: body
            widget: markdown
            hint: "Shown in the About section of the homepage — supports markdown"

  # ── Pages — about, now, projects, anything else ─────────────────────────────
  - name: pages
    label: "Pages (about, now, etc.)"
    folder: src/content/site-pages
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: Title
        name: title
        widget: string
        hint: "Shown in the nav and as the page heading (e.g. 'about', 'now')"
      - label: URL Slug
        name: slug
        widget: string
        hint: "URL path — must start with / (e.g. /about, /now, /projects)"
      - label: Content
        name: body
        widget: markdown
      - label: Meta Description
        name: description
        widget: string
        required: false
        hint: "Controls the text snippet shown under your page title in Google search results, and the preview text when shared on Twitter/X, LinkedIn, WhatsApp or iMessage. Keep it under 155 characters. Leave blank to auto-generate from page content."
      - label: Show in Nav
        name: showInNav
        widget: boolean
        default: true
      - label: Nav Order
        name: navOrder
        widget: number
        default: 99
        hint: "Lower = earlier in nav. home=1, blog=2, about=3"
      - label: Canva Embed
        name: canvaEmbed
        widget: string
        required: false
        hint: "Optional. In Canva: Share → More → Embed, then paste the embed link or the whole embed code here to show a Canva design on this page."

  # ── Blog posts ───────────────────────────────────────────────────────────────
  - name: blog
    label: "Blog Posts (/blog)"
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    sortable_fields:
      - pubDate
      - title
    default_sort_field: pubDate
    default_sort_direction: descending
    fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: string
        hint: "Shown under the post title in Google search results, on the blog list page, and when the post is shared on social media. Write 1-2 clean sentences, no markdown, under 155 characters."
      - label: Publish Date
        name: pubDate
        widget: datetime
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        default: ""
      - label: Tags
        name: tags
        widget: relation
        collection: tags
        search_fields: [title]
        display_fields: [title]
        value_field: title
        required: false
        multiple: true
      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: "Toggle off to publish"
      - label: Cover Image
        name: image
        widget: image
        required: false
        hint: "Used for social sharing preview (OG image)"
      - label: Body
        name: body
        widget: markdown
